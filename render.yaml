services:
  - type: web
    name: trend-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # `seed` is idempotent (skips rows already in DB) so it's safe on every
    # restart. Without it the RSS sources never get seeded and PH news stays empty.
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
